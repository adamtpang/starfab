<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>starfab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --fg: #e8eaed;
      --muted: #9aa3ad;
      --line: #23282f;
      --accent: #c9a227;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", Times, serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 22vh 1.5rem 3rem;
    }
    p.mark {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0 0 1.25rem;
    }
    h1 {
      font-weight: 500;
      font-size: 2.75rem;
      letter-spacing: -0.03em;
      margin: 0 0 0.85rem;
    }
    .desc {
      font-size: 1.15rem;
      line-height: 1.5;
      color: var(--fg);
      margin: 0 0 2rem;
    }
    .disclaimer {
      border-top: 1px solid var(--line);
      padding-top: 1.1rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin: 0;
    }
    a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="mark">Placeholder</p>
    <h1>starfab</h1>
    <p class="desc">An unofficial production-line simulation of a kit factory, built as a learning project and proof of work.</p>
    <p class="disclaimer">Unofficial fan or learning project, not affiliated with SpaceX.</p>
  </main>
</body>
</html>
